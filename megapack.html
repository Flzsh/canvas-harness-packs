<script>(function megapackStates(TAGS, WAIT) {
  'use strict';
  const roots = [...document.querySelectorAll('[data-mp]')].filter(r => Object.hasOwn(TAGS, r.dataset.mp));
  if (!roots.length) return;
  const state = new Map(), asked = new Map(), known = new Set(), FACE = { wait: 'add', ready: 'add', asked: 'adding', getting: 'adding', needs: 'needs', added: 'added' };

  let engine = 0, waited = false, toastTimer = 0;
  const say = text => { if (!toast) return; toast.textContent = text; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 6000); };
  const need = id => Number(roots.find(r => r.dataset.mp === id).dataset.engine) || 1;
  const able = id => engine >= need(id) || known.has(id);
  const idle = id => able(id) ? 'ready' : engine || waited ? 'needs' : 'wait';
  const set = (id, name, done = 0, total = 0) => {
    state.set(id, { name, done, total });
    const face = FACE[name];
    for (const r of roots) {
      if (r.dataset.mp !== id) continue;
      r.dataset.mpState = name;
      const b = r.querySelector('button.add[data-ch-pack]'), bar = r.querySelector('.mp-progress'), line = r.querySelector('.mp-line'), amount = r.querySelector('.mp-amount'), title = r.dataset.name;
      if (b) {
        if (b.dataset.mpFace !== face) { b.innerHTML = TAGS[id][face]; b.dataset.mpFace = face; }
        b.disabled = name !== 'ready';
        b.setAttribute('aria-label', face === 'add' ? 'Add ' + title : face === 'adding' ? 'Adding ' + title : title + ': ' + (face === 'needs' ? TAGS[id].needsText : 'Added'));
      }
      if (bar) bar.hidden = name !== 'getting';
      if (name === 'getting' && line && amount) {
        const p = Math.max(0, Math.min(100, done / total * 100)), mb = Math.max(1, Math.round(total / 1e6));
        line.style.setProperty('--mp-p', p.toFixed(1)); line.setAttribute('aria-valuenow', String(Math.round(p)));
        amount.textContent = (done >= total ? mb : Math.min(mb - 1, Math.floor(done / 1e6))) + ' of ' + mb + ' MB';
      }

    }
  };
  const settle = id => { const s = state.get(id).name; if (s === 'wait' || s === 'needs') set(id, idle(id)); };
  for (const r of roots) {
    const id = r.dataset.mp, b = r.querySelector('button.add[data-ch-pack]');
    if (!state.has(id)) set(id, 'wait');
    // the bridge acts on the click first (it listens on the document, capturing); nothing else on the page should
    if (b) b.addEventListener('click', e => {
      e.stopPropagation();

    });

    const link = r.querySelector('a.mp-link');
    if (link && r.classList.contains('card')) {
      r.addEventListener('click', e => { if (e.target.closest('.add')) return; e.stopPropagation(); if (e.target.closest('a')) return; if (e.ctrlKey || e.metaKey || e.shiftKey) window.open(link.href, '_blank', 'noopener'); else location.assign(link.href); }, true);
      r.addEventListener('keydown', e => { if (e.key !== 'Enter' || e.target.closest('.add')) return; e.stopPropagation(); if (!e.target.closest('a')) location.assign(link.href); }, true);
    }
  }
  addEventListener('message', e => {
    const d = e.data;
    if (e.origin !== location.origin || !d || typeof d !== 'object' || d.ch !== 'market') return;
    if (Number.isInteger(d.megapack) && d.megapack > 0) { engine = Math.max(engine, d.megapack); for (const id of state.keys()) settle(id); }
    if (Array.isArray(d.installed)) for (const id of d.installed) if (state.has(id)) { known.add(id); set(id, 'added'); }
    if (typeof d.id !== 'string' || !state.has(d.id)) return;
    const id = d.id;
    if (d.state === 'getting') {
      if (state.get(id).name === 'added' || !Number.isFinite(d.total) || d.total <= 0 || !Number.isFinite(d.done) || d.done < 0) return;
      known.add(id); clearTimeout(asked.get(id)); set(id, 'getting', Math.min(d.done, d.total), d.total);
    } else if (d.state === 'added') { known.add(id); clearTimeout(asked.get(id)); set(id, 'added'); }
