name: Check Market submission
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: market-submission-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'submission') && (github.event.action != 'labeled' || github.event.label.name == 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check and explain the result
        run: node tools/submission.cjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}
