name: Prepare approved Market pack
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: market-submission-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approve:
    if: github.event.label.name == 'approved' && github.event.sender.login == github.event.repository.owner.login && contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Recheck and open the publication pull request
        run: node tools/submission.cjs approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
